<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">DTSC dual-tier sector charging schematic</title>
  <desc id="desc">A consumption-balanced angular sector with an inner charger that returns to base and an outer charger that is resupplied at a rendezvous.</desc>
  <defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#0d6179"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#b46a2d"/></marker><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17222b}.small{font-size:13px;fill:#58656f}.label{font-size:15px;font-weight:650}.tiny{font-size:12px;fill:#58656f}.sensor{fill:#fff;stroke:#64727a;stroke-width:2}.inner{fill:#e4f0f3;stroke:#0d6179;stroke-width:2}.outer{fill:#f8eadb;stroke:#b46a2d;stroke-width:2}.routei{fill:none;stroke:#0d6179;stroke-width:3}.routeo{fill:none;stroke:#b46a2d;stroke-width:3}</style></defs>
  <rect width="1000" height="560" fill="#fff"/><rect x="24" y="22" width="952" height="490" rx="6" fill="#fbfcfb" stroke="#d4d9d8"/>
  <text x="52" y="58" class="label">DTSC: one consumption-balanced sector, two cooperating tiers</text><text x="52" y="80" class="small">The partition follows energy demand; only the inner charger visits the base station.</text>
  <path d="M142 423 L760 124 A710 710 0 0 1 869 443 Z" class="outer"/><path d="M142 423 L475 262 A380 380 0 0 1 534 432 Z" class="inner"/>
  <path d="M142 423 L760 124" fill="none" stroke="#9ea9ad" stroke-width="1.5"/><path d="M142 423 L869 443" fill="none" stroke="#9ea9ad" stroke-width="1.5"/>
  <circle cx="142" cy="423" r="17" fill="#17222b"/><path d="M132 423 L142 401 L152 423" fill="none" stroke="#fff" stroke-width="2.5"/><text x="81" y="456" class="small">base station</text>
  <g><circle cx="330" cy="350" r="7" class="sensor"/><circle cx="370" cy="390" r="7" class="sensor"/><circle cx="422" cy="328" r="7" class="sensor"/><circle cx="470" cy="400" r="7" class="sensor"/><circle cx="560" cy="287" r="7" class="sensor"/><circle cx="637" cy="250" r="7" class="sensor"/><circle cx="710" cy="330" r="7" class="sensor"/><circle cx="770" cy="389" r="7" class="sensor"/><circle cx="827" cy="330" r="7" class="sensor"/></g>
  <path d="M142 423 C245 397 282 320 364 334 C423 345 440 397 501 413 L142 423" class="routei" marker-end="url(#blue)"/><text x="229" y="301" class="label" fill="#0d6179">inner charger</text><text x="233" y="321" class="tiny">departs from and returns to base</text>
  <path d="M537 292 C625 210 744 223 816 319 C849 363 799 419 700 403" class="routeo" marker-end="url(#orange)"/><text x="638" y="183" class="label" fill="#b46a2d">outer charger</text><text x="638" y="203" class="tiny">serves outer tier; does not return to base</text>
  <path d="M518 271 l12 12 l-12 12 l-12-12z" fill="#fff" stroke="#17222b" stroke-width="2"/><text x="468" y="250" class="label">rendezvous</text><text x="438" y="316" class="tiny">energy handoff</text><path d="M498 285 L465 335" stroke="#0d6179" stroke-width="2" marker-end="url(#blue)"/><path d="M538 285 L575 305" stroke="#b46a2d" stroke-width="2" marker-end="url(#orange)"/>
  <line x1="54" y1="474" x2="80" y2="474" class="routei" marker-end="url(#blue)"/><text x="90" y="479" class="small">inner tier: base replenishment</text><line x1="350" y1="474" x2="376" y2="474" class="routeo" marker-end="url(#orange)"/><text x="387" y="479" class="small">outer tier: rendezvous replenishment</text>
</svg>
