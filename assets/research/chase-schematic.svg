<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">CHASE ground and aerial vehicle scheduling schematic</title>
  <desc id="desc">A technical snapshot showing a ground vehicle on an EDF anchor leg, corridor requests, and a carried UAV that serves an outer request then meets the vehicle ahead.</desc>
  <defs><marker id="navy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#0d6179"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#b46a2d"/></marker><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17222b}.small{font-size:13px;fill:#58656f}.label{font-size:15px;font-weight:650}.tiny{font-size:12px;fill:#58656f}.sensor{fill:#fff;stroke:#64727a;stroke-width:2}.urgent{fill:#f7ddd4;stroke:#b44a3c;stroke-width:2}.route{fill:none;stroke:#0d6179;stroke-width:3}.flight{fill:none;stroke:#b46a2d;stroke-width:3;stroke-dasharray:7 5}</style></defs>
  <rect width="1000" height="560" fill="#fff"/><rect x="24" y="22" width="952" height="490" rx="6" fill="#fbfcfb" stroke="#d4d9d8"/>
  <text x="52" y="58" class="label">CHASE: one ground-vehicle leg with an aerial side mission</text><text x="52" y="80" class="small">A fixed inner area is handled near base; outer service combines an EDF anchor, corridor detours, and forward rendezvous.</text>
  <circle cx="162" cy="299" r="95" fill="#e4f0f3" stroke="#0d6179" stroke-width="2"/><text x="96" y="196" class="label" fill="#0d6179">fixed inner area</text><text x="98" y="217" class="tiny">base-station UAV service</text><circle cx="162" cy="299" r="17" fill="#17222b"/><path d="M152 299 L162 277 L172 299" fill="none" stroke="#fff" stroke-width="2.5"/>
  <g><circle cx="118" cy="260" r="6" class="sensor"/><circle cx="198" cy="243" r="6" class="sensor"/><circle cx="210" cy="335" r="6" class="sensor"/><circle cx="119" cy="347" r="6" class="sensor"/></g>
  <path d="M270 350 C396 306 543 237 748 176" stroke="#0d6179" stroke-width="76" stroke-opacity=".10" fill="none" stroke-linecap="round"/><path d="M270 350 C396 306 543 237 748 176" class="route" marker-end="url(#navy)"/><text x="390" y="273" class="tiny">narrow bypass corridor</text>
  <circle cx="390" cy="300" r="7" class="sensor"/><circle cx="500" cy="258" r="7" class="sensor"/><circle cx="594" cy="230" r="7" class="sensor"/><text x="459" y="326" class="tiny">pending requests considered along this leg</text>
  <circle cx="760" cy="172" r="10" class="urgent"/><text x="776" y="165" class="label">EDF anchor</text><text x="778" y="186" class="tiny">most urgent ground target</text>
  <g><rect x="315" y="324" width="38" height="22" rx="5" fill="#0d6179" stroke="#fff" stroke-width="3"/><circle cx="323" cy="350" r="4" fill="#17222b"/><circle cx="345" cy="350" r="4" fill="#17222b"/></g><text x="290" y="375" class="tiny">WCV + carried UAV</text>
  <path d="M335 318 Q445 135 579 158 Q651 170 685 260 Q704 302 676 326" class="flight" marker-end="url(#orange)"/><g transform="translate(456 144)"><path d="M0 7 L9 0 L18 7 L9 14Z" fill="#b46a2d"/><path d="M-4 7 H22 M9 -4 V18" stroke="#b46a2d" stroke-width="2"/></g><circle cx="582" cy="159" r="10" class="urgent"/><text x="522" y="126" class="label" fill="#b46a2d">outer request</text><text x="475" y="282" class="tiny">UAV launch → service → rejoin</text>
  <path d="M670 314 l12 12 l-12 12 l-12-12z" fill="#fff" stroke="#17222b" stroke-width="2"/><text x="684" y="334" class="label">forward rendezvous</text><text x="684" y="354" class="tiny">predicted point on WCV route</text>
  <line x1="54" y1="474" x2="80" y2="474" class="route" marker-end="url(#navy)"/><text x="90" y="479" class="small">ground vehicle anchor leg</text><line x1="330" y1="474" x2="356" y2="474" class="flight" marker-end="url(#orange)"/><text x="367" y="479" class="small">UAV side mission</text>
</svg>
