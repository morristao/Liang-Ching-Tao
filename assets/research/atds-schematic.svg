<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">ATDS threshold and detour scheduling schematic</title>
  <desc id="desc">A technical scheduling snapshot showing cluster thresholds, an assigned charging route, and a corridor-feasible detour to a critical cluster.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#0d6179"/></marker><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17222b}.small{font-size:13px;fill:#58656f}.label{font-size:15px;font-weight:650}.tiny{font-size:12px;fill:#58656f}.node{fill:#fff;stroke:#64727a;stroke-width:2}.urgent{fill:#f7ddd4;stroke:#b44a3c;stroke-width:2}.cluster{fill:none;stroke:#9ea9ad;stroke-width:1.5;stroke-dasharray:4 4}.route{fill:none;stroke:#0d6179;stroke-width:3}.optional{fill:none;stroke:#b44a3c;stroke-width:3;stroke-dasharray:7 5}</style></defs>
  <rect width="1000" height="560" fill="#fff"/><rect x="24" y="22" width="952" height="490" rx="6" fill="#fbfcfb" stroke="#d4d9d8"/>
  <text x="52" y="58" class="label">ATDS: thresholded requests and one route-time detour</text><text x="52" y="80" class="small">The request threshold is updated per cluster; the detour decision is taken only at departure.</text>
  <rect x="72" y="250" width="48" height="31" rx="4" fill="#17222b"/><path d="M84 250 L96 227 L108 250" fill="none" stroke="#17222b" stroke-width="3"/><text x="67" y="305" class="small">base</text>
  <ellipse cx="280" cy="170" rx="88" ry="61" class="cluster"/><text x="223" y="107" class="tiny">cluster A · threshold τA</text><circle cx="250" cy="169" r="7" class="node"/><circle cx="282" cy="145" r="7" class="node"/><circle cx="307" cy="184" r="7" class="node"/><circle cx="273" cy="208" r="7" class="node"/>
  <ellipse cx="497" cy="295" rx="78" ry="57" class="cluster"/><text x="442" y="230" class="tiny">cluster B · critical request</text><circle cx="466" cy="287" r="8" class="urgent"/><circle cx="505" cy="265" r="8" class="urgent"/><circle cx="530" cy="313" r="8" class="urgent"/><circle cx="486" cy="333" r="8" class="urgent"/>
  <ellipse cx="780" cy="180" rx="93" ry="64" class="cluster"/><text x="713" y="108" class="tiny">cluster C · selected target</text><circle cx="744" cy="175" r="7" class="node"/><circle cx="783" cy="148" r="7" class="node"/><circle cx="818" cy="186" r="7" class="node"/><circle cx="778" cy="213" r="7" class="node"/>
  <path d="M130 262 L732 184" class="route" marker-end="url(#arrow)"/><path d="M402 227 L570 206" stroke="#0d6179" stroke-width="74" stroke-opacity=".10" stroke-linecap="round"/><text x="403" y="196" class="tiny">feasible detour corridor</text>
  <path d="M375 229 Q472 246 567 214" class="optional"/><path d="M567 214 Q662 196 731 184" class="optional"/><text x="456" y="377" class="label" fill="#b44a3c">detour only when B becomes critical</text>
  <g><rect x="323" y="234" width="33" height="20" rx="5" fill="#0d6179" stroke="#fff" stroke-width="3"/><circle cx="330" cy="257" r="4" fill="#17222b"/><circle cx="349" cy="257" r="4" fill="#17222b"/></g><text x="296" y="279" class="tiny">mobile charger</text>
  <line x1="54" y1="474" x2="80" y2="474" class="route" marker-end="url(#arrow)"/><text x="90" y="479" class="small">scheduled route</text><line x1="250" y1="474" x2="276" y2="474" class="optional"/><text x="287" y="479" class="small">accepted detour</text><circle cx="488" cy="474" r="7" class="urgent"/><text x="503" y="479" class="small">threshold-triggered request</text>
</svg>
